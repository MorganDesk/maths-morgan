<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mur des Champions - Maths Morgan</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 448 512'%3E%3Cpath d='M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384c53 0 96-43 96-96V96c0-53-43-96-96-96H96zM48 96c0-26.5 21.5-48 48-48H384c26.5 0 48 21.5 48 48V416c0 26.5-21.5 48-48 48H96c-26.5 0-48-21.5-48-48V96z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/progression.css">
    <link rel="stylesheet" href="css/cloud.css">
    <link rel="stylesheet" href="css/champions.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-trophy"></i> Mur des Champions</h1>
        <nav id="filter-menu">
            <!-- Les filtres seront injectés ici par menu.js -->
        </nav>
    </header>

    <div id="cloud-bar">
        <!-- Barre cloud injectée par cloud_manager.js -->
    </div>

    <main>
        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <h2>Classement des Élèves</h2>
                <div class="leaderboard-tabs">
                    <button class="tab-btn active" data-period="global">Global</button>
                    <button class="tab-btn" data-period="weekly">Hebdo</button>
                    <button class="tab-btn" data-period="monthly">Mensuel</button>
                </div>

                <div class="level-filters">
                    <button class="level-btn active" data-level="tous">Tous</button>
                    <button class="level-btn" data-level="6e">6ème</button>
                    <button class="level-btn" data-level="5e">5ème</button>
                    <button class="level-btn" data-level="4e">4ème</button>
                    <button class="level-btn" data-level="3e">3ème</button>
                </div>
            </div>

            <div id="leaderboard-content" class="leaderboard-content">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i> Chargement du classement...
                </div>
                <!-- Le tableau du classement sera injecté ici -->
            </div>
        </div>
    </main>

    <footer>
        <p><i class="fa-solid fa-shield-halved"></i> Le classement est mis à jour toutes les 5 minutes. Seuls les élèves connectés au Cloud apparaissent ici.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/menu.js" type="module"></script>
    <script src="js/cloud_manager.js" type="module"></script>
    <script src="js/champions.js" type="module"></script>
</body>
</html>
